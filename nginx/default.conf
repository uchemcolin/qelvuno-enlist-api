# ============================================================
# NGINX CONFIGURATION
# LARAVEL REVERSE PROXY
# ============================================================
#
# Purpose:
#
# Keep old frontend API URLs working:
#
# /enlist_backend_api/public/api/users
#
# while forwarding internally to Laravel:
#
# /api/users
#
# ============================================================


server {


    # Nginx listens on HTTP port 80

    listen 80;


    server_name _;



    # ========================================================
    # LEGACY URL SUPPORT
    # ========================================================
    #
    # React currently calls:
    #
    # /enlist_backend_api/public/api/...
    #
    # Remove that prefix before sending to Laravel.
    #
    # Example:
    #
    # Incoming:
    # /enlist_backend_api/public/api/login
    #
    # Laravel receives:
    # /api/login
    #
    # ========================================================

    location /enlist_backend_api/public/ {


        proxy_pass http://app:8000/;



        # Keep original request information

        proxy_set_header Host $host;


        proxy_set_header X-Real-IP $remote_addr;


        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header X-Forwarded-Proto $scheme;


    }




    # ========================================================
    # NORMAL LARAVEL ROUTES
    # ========================================================
    #
    # Also allows:
    #
    # /api/users
    # /login
    # /
    #
    # ========================================================


    location / {


        proxy_pass http://app:8000/;



        proxy_http_version 1.1;



        proxy_set_header Host $host;


        proxy_set_header X-Real-IP $remote_addr;


        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header X-Forwarded-Proto $scheme;


    }


}